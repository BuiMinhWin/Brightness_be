services:
  redis:
    image: redis:8.2-alpine
    restart: always
    command: >
      sh -c "redis-server --save 60 1 --loglevel warning --appendonly yes --requirepass ${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - app_network

  authentication-api:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/brightness-prod-authentication-api:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BrightnessDb: "Host=${RDS_HOST};Port=5432;Database=BrightnessDb;Username=${RDS_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true;SslMode=Require;Trust Server Certificate=true"
      ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD}"
    networks:
      - app_network

  gateway-api:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/brightness-prod-gateway-api:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8088:8080"
    networks:
      - app_network

  measurement-api:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/brightness-prod-measurement-api:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BrightnessDb: "Host=${RDS_HOST};Port=5432;Database=BrightnessDb;Username=${RDS_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true;SslMode=Require;Trust Server Certificate=true"
    networks:
      - app_network

  challenge-api:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/brightness-prod-challenge-api:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BrightnessDb: "Host=${RDS_HOST};Port=5432;Database=BrightnessDb;Username=${RDS_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true;SslMode=Require;Trust Server Certificate=true"
    networks:
      - app_network

  social-api:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/brightness-prod-social-api:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BrightnessDb: "Host=${RDS_HOST};Port=5432;Database=BrightnessDb;Username=${RDS_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true;SslMode=Require;Trust Server Certificate=true"
    networks:
      - app_network

  billing-api:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/brightness-prod-billing-api:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BrightnessDb: "Host=${RDS_HOST};Port=5432;Database=BrightnessDb;Username=${RDS_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true;SslMode=Require;Trust Server Certificate=true"
    networks:
      - app_network

  media-api:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/brightness-prod-media-api:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BrightnessDb: "Host=${RDS_HOST};Port=5432;Database=BrightnessDb;Username=${RDS_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true;SslMode=Require;Trust Server Certificate=true"
    networks:
      - app_network

  chat-service:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/brightness-prod-chat-service:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BrightnessDb: "Host=${RDS_HOST};Port=5432;Database=BrightnessDb;Username=${RDS_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true;SslMode=Require;Trust Server Certificate=true"
      Services__PersonalCoachAPI: http://personal-coach-api:8080
    networks:
      - app_network

  ai-ocr-service:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/brightness-prod-ai-ocr-service:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BrightnessDb: "Host=${RDS_HOST};Port=5432;Database=BrightnessDb;Username=${RDS_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true;SslMode=Require;Trust Server Certificate=true"
    networks:
      - app_network

  personal-coach-api:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/brightness-prod-personal-coach-api:${IMAGE_TAG:-latest}
    restart: always
    env_file: ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__BrightnessDb: "Host=${RDS_HOST};Port=5432;Database=BrightnessDb;Username=${RDS_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true;SslMode=Require;Trust Server Certificate=true"
      ConnectionStrings__DefaultConnection: "Host=${RDS_HOST};Port=5432;Database=BrightnessDb;Username=${RDS_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true;SslMode=Require;Trust Server Certificate=true"
    networks:
      - app_network

networks:
  app_network: {}

volumes:
  redis_data: {}

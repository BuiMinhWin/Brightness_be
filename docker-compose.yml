    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BrightnessDb: Host=postgres;Port=5432;Database=BrightnessDb;Username=postgres;Password=12345;IncludeErrorDetail=true
      GoogleVision__ApiKey: ${GOOGLE_VISION_API_KEY}
      GoogleAI__ApiKey: ${GOOGLE_AI_API_KEY}
      GoogleAI__Model: gemini-2.5-flash
    ports:
      - "8089:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network: {}

volumes:
  postgres_data: {}
  pgadmin_data: {}
  pgdata: {}

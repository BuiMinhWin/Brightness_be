services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: BrightnessDb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  authentication-api:
    build:
      context: .
      dockerfile: AuthenticationAPI/AuthenticationAPI.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BrightnessDb: Host=postgres;Port=5432;Database=BrightnessDb;Username=postgres;Password=12345;IncludeErrorDetail=true
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  gateway-api:
    build:
      context: .
      dockerfile: GatewayAPI/APIGateway.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BrightnessDb: Host=postgres;Port=5432;Database=BrightnessDb;Username=postgres;Password=12345;IncludeErrorDetail=true
    ports:
      - "8088:8088"
    depends_on:
      - authentication-api
      - measurement-api
      - workout-api
      - nutrition-api
      - challenge-api
      - social-api
      - billing-api
      - media-api
      - chat-service

  measurement-api:
    build:
      context: .
      dockerfile: MeasurementAPI/MeasurementAPI.Presentation/Dockerfile

x-cors-origins: &cors_origins
  Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS__0}
  Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGINS__1}
  Cors__AllowedOrigins__2: ${CORS_ALLOWED_ORIGINS__2}
  Cors__AllowedOrigins__3: ${CORS_ALLOWED_ORIGINS__3}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_DB: BrightnessDb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"  # host:container
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./PersonalCoachAPI/Scripts:/scripts:ro  # Mount setup scripts
      - ./deploy:/docker-entrypoint-initdb.d:ro
    command: >
      postgres -c listen_addresses='*' -c log_statement=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  redis:
    image: redis:8.2-alpine
    restart: always
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - app_network

  redisinsight:
    image: redis/redisinsight:latest
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_started
    volumes:
      - redisinsight_data:/data
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  authentication-api:
    build:
      context: .
      dockerfile: AuthenticationAPI/AuthenticationAPI.Presentation/Dockerfile
    volumes:
      - ./AuthenticationAPI/AuthenticationAPI.Presentation/wwwroot/uploads:/app/wwwroot/uploads
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD not set}
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Authentication__Google__ClientId: ${AUTHENTICATION__GOOGLE__CLIENTID}
      Authentication__Google__ClientSecret: ${AUTHENTICATION__GOOGLE__CLIENTSECRET}

      Swagger__JsonEndpoint: /auth/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /auth
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD not set}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  gateway-api:
    build:
      context: .
      dockerfile: GatewayAPI/APIGateway.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: Development
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
     


    ports:
      - "8088:8080"
    depends_on:
      - authentication-api
      - measurement-api
      - challenge-api
      - social-api
      - billing-api
      - media-api
      - chat-service
      - ai-ocr-service
      - personal-coach-api
    networks:
      - app_network

  measurement-api:
    build:
      context: .
      dockerfile: MeasurementAPI/MeasurementAPI.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /measurement/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /measurement
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network
  challenge-api:
    build:
      context: .
      dockerfile: ChallengeAPI/ChallengeAPI.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /challenge/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /challenge
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  social-api:
    build:
      context: .
      dockerfile: SocialAPI/SocialAPI.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /social/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /social
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  billing-api:
    build:
      context: .
      dockerfile: BillingAPI/BillingAPI.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /billing/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /billing
      PaymentGateways__PayOs__ClientId: ${PAYMENTGATEWAYS__PAYOS__CLIENTID}
      PaymentGateways__PayOs__ApiKey: ${PAYMENTGATEWAYS__PAYOS__APIKEY}
      PaymentGateways__PayOs__ChecksumKey: ${PAYMENTGATEWAYS__PAYOS__CHECKSUMKEY}
      Email__Host: ${EMAIL__HOST}
      Email__Port: ${EMAIL__PORT}
      Email__EnableSsl: ${EMAIL__ENABLESSL}
      Email__User: ${EMAIL__USER}
      Email__Password: ${EMAIL__PASSWORD}
      Email__FromEmail: ${EMAIL__FROMEMAIL}
      Email__FromName: ${EMAIL__FROMNAME}

    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  media-api:
    build:
      context: .
      dockerfile: MediaAPI/MediaAPI.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /media/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  chat-service:
    build:
      context: .
      dockerfile: ChatService/ChatService.Presentation/Dockerfile
    env_file:
      - .env
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /chat/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /chat
      GoogleAI__ApiKey: ${GOOGLE_AI_API_KEY}
      GoogleAI__Model: gemini-2.5-flash
      MESSAGE_LIMITS_FREE_DAILY: ${MESSAGE_LIMITS_FREE_DAILY:-10}
      MESSAGE_LIMITS_FREE_MONTHLY: ${MESSAGE_LIMITS_FREE_MONTHLY:-100}
      MESSAGE_LIMITS_PREMIUM_DAILY: ${MESSAGE_LIMITS_PREMIUM_DAILY:-100}
      MESSAGE_LIMITS_PREMIUM_MONTHLY: ${MESSAGE_LIMITS_PREMIUM_MONTHLY:-1000}
      CONVERSATION_SUMMARIZATION_THRESHOLD: ${CONVERSATION_SUMMARIZATION_THRESHOLD:-10}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      Services__PersonalCoachAPI: http://personal-coach-api:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  ai-ocr-service:
    build:
      context: .
      dockerfile: AIOCRService/AIOCRService.Presentation/Dockerfile
    env_file:
      - .env
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      GoogleVision__ApiKey: ${GOOGLE_VISION_API_KEY}
      GoogleAI__ApiKey: ${GOOGLE_AI_API_KEY}
      GoogleAI__Model: gemini-2.5-flash
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /ai-ocr/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /ai-ocr
      
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  personal-coach-api:
    build:
      context: .
      dockerfile: PersonalCoachAPI/PersonalCoachAPI.Presentation/Dockerfile
    env_file:
      - .env
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      GoogleAI__ApiKey: ${GOOGLE_AI_API_KEY}
      GoogleAI__Model: gemini-2.5-flash
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /coach/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /coach
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network: {}

volumes:
  postgres_data: {}
  pgadmin_data: {}
  pgdata: {}
  redis_data: {}
  redisinsight_data: {}

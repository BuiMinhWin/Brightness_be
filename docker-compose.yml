  personal-coach-api:
    build:
      context: .
      dockerfile: PersonalCoachAPI/PersonalCoachAPI.Presentation/Dockerfile
    env_file:
      - .env
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      GoogleAI__ApiKey: ${GOOGLE_AI_API_KEY}
      GoogleAI__Model: gemini-2.5-flash
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}

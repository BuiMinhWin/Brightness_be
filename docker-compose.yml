    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      GoogleVision__ApiKey: ${GOOGLE_VISION_API_KEY}
      GoogleAI__ApiKey: ${GOOGLE_AI_API_KEY}
      GoogleAI__Model: gemini-2.5-flash
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /ai-ocr/swagger/v1/swagger.json

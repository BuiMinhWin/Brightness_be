services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_DB: BrightnessDb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"  # host:container
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./PersonalCoachAPI/Scripts:/scripts:ro  # Mount setup scripts
    command: >
      postgres -c listen_addresses='*' -c log_statement=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  authentication-api:
    build:
      context: .
      dockerfile: AuthenticationAPI/AuthenticationAPI.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  gateway-api:
    build:
      context: .
      dockerfile: GatewayAPI/APIGateway.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
    ports:
      - "8088:5000"
    depends_on:
      - authentication-api
      - measurement-api
      - workout-api
      - nutrition-api
      - challenge-api
      - social-api
      - billing-api
      - media-api
      - chat-service
      - ai-ocr-service
    networks:
      - app_network

  measurement-api:

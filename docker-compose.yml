x-cors-origins: &cors_origins
  Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS__0}
  Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGINS__1}
  Cors__AllowedOrigins__2: ${CORS_ALLOWED_ORIGINS__2}
  Cors__AllowedOrigins__3: ${CORS_ALLOWED_ORIGINS__3}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_DB: BrightnessDb
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"  # host:container
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./PersonalCoachAPI/Scripts:/scripts:ro  # Mount setup scripts
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/10-init-databases.sql:ro
    command: >
      postgres -c listen_addresses='*' -c log_statement=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  redis:
    image: redis:8.2-alpine
    restart: always
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  authentication-api:
    build:
      context: .
      dockerfile: AuthenticationAPI/AuthenticationAPI.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /auth/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /auth
      Redis__ConnectionString: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  gateway-api:
    build:
      context: .
      dockerfile: GatewayAPI/APIGateway.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
    ports:
      - "8088:5000"
    depends_on:
      - authentication-api
      - measurement-api
      - workout-api
      - nutrition-api
      - challenge-api
      - social-api
      - billing-api
      - media-api
      - chat-service
      - ai-ocr-service
      - personal-coach-api
    networks:
      - app_network

  measurement-api:
    build:
      context: .
      dockerfile: MeasurementAPI/MeasurementAPI.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /measurement/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /measurement
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  workout-api:
    build:
      context: .
      dockerfile: WorkoutAPI/WorkoutAPI.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /workout/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /workout
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  nutrition-api:
    build:
      context: .
      dockerfile: NutritionAPI/NutritionAPI.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /nutrition/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /nutrition
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  challenge-api:
    build:
      context: .
      dockerfile: ChallengeAPI/ChallengeAPI.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /challenge/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /challenge
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  social-api:
    build:
      context: .
      dockerfile: SocialAPI/SocialAPI.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /social/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /social
    depends_on:

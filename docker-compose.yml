  billing-api:
    build:
      context: .
      dockerfile: BillingAPI/BillingAPI.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
      Authentication__Key: ${AUTHENTICATION__KEY}
      Authentication__Issuer: ${AUTHENTICATION__ISSUER}
      Authentication__Audience: ${AUTHENTICATION__AUDIENCE}
      Swagger__JsonEndpoint: /billing/swagger/v1/swagger.json
      Swagger__GatewayPrefix: /billing
      PaymentGateways__PayOs__ClientId: ${PAYMENTGATEWAYS__PAYOS__CLIENTID}
      PaymentGateways__PayOs__ApiKey: ${PAYMENTGATEWAYS__PAYOS__APIKEY}
      PaymentGateways__PayOs__ChecksumKey: ${PAYMENTGATEWAYS__PAYOS__CHECKSUMKEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  media-api:
    build:
      context: .
      dockerfile: MediaAPI/MediaAPI.Presentation/Dockerfile
    environment:
      <<: *cors_origins
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__BrightnessDb: Host=postgres;Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};IncludeErrorDetail=true
